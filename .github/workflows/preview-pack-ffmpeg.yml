name: Build FFmpeg preview pack

# Decode-only LGPL FFmpeg for Pulse's optional media preview pack.
# Run manually; a tag "pack-ffmpeg-<version>" publishes the zip and its
# manifest to a release of that name, where Pulse's pack installer finds it.

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: FFmpeg release to build (e.g. 7.1.1)
        required: true
        default: '7.1.1'
  push:
    tags: ['pack-ffmpeg-[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make diffutils tar xz curl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib mingw-w64-x86_64-dav1d
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/pack-ffmpeg-* ]]; then
            echo "value=${GITHUB_REF#refs/tags/pack-ffmpeg-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.ffmpeg_version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        # Windows runners check out with CRLF; bash needs LF.
        run: sed -i "s/\r$//" packs/ffmpeg/build.sh && bash packs/ffmpeg/build.sh "${{ steps.version.outputs.value }}" pack-out
      - name: Smoke test
        shell: pwsh
        run: |
          $ff = "pack-out/ffmpeg.exe"
          $decoders = (& $ff -hide_banner -decoders) -join "`n"
          foreach ($d in 'hevc','h264','vp9','libdav1d','prores','rv40','flv','mpeg2video','aac','flac','ape') {
            if ($decoders -notmatch "\s$d\s") { throw "missing decoder: $d" }
          }
          & $ff -hide_banner -buildconf | Select-String -Pattern 'enable-gpl|enable-nonfree' | ForEach-Object { throw "GPL/nonfree flag in build: $_" }
      - name: Check the pack is self-contained
        run: |
          for exe in pack-out/ffmpeg.exe pack-out/ffprobe.exe; do
            if objdump -p "$exe" | grep -iE 'DLL Name: (libwinpthread|libgcc|libstdc|libdav1d|zlib1)'; then
              echo "$exe depends on a MinGW DLL"; exit 1
            fi
          done
      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $zip = "pulse-pack-ffmpeg-$version-win64.zip"
          Compress-Archive -Path pack-out/* -DestinationPath $zip
          $files = Get-ChildItem pack-out -File | ForEach-Object {
            [ordered]@{ name = $_.Name; size = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() }
          }
          $manifest = [ordered]@{
            id = 'ffmpeg'; version = $version; license = 'LGPL-2.1-or-later'
            archive = [ordered]@{ name = $zip; size = (Get-Item $zip).Length; sha256 = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() }
            files = $files
            min_pulse = '1.0.53'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "pulse-pack-ffmpeg-$version.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pack-ffmpeg
          path: |
            pulse-pack-ffmpeg-*.zip
            pulse-pack-ffmpeg-*.json
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/pack-ffmpeg-')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pack-ffmpeg
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag --repo '${{ github.repository }}' --title "FFmpeg preview pack $($tag -replace 'pack-ffmpeg-','')" `
            --notes 'Optional decode-only LGPL FFmpeg for Pulse previews. Installed from Settings > Preview packs.' `
            (Get-ChildItem pulse-pack-ffmpeg-*)
